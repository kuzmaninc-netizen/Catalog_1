# Render Blueprint: бекенд (Express + SQLite) со постојан диск.
# Render → New → Blueprint → изберете го репозиториумот.
services:
  - type: web
    name: catalog-mk-api
    runtime: node
    rootDir: server
    plan: starter            # потребен е платен план за постојан диск
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/catalog.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Netlify прокси + Render прокси = 2 скока до вистинската IP адреса
      - key: TRUST_PROXY
        value: "2"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
